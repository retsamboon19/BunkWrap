name: Publish versioned release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify release
        run: python -m unittest discover -s tests -v

      - name: Build Windows ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = Join-Path $PWD "release\BunkrWrap-$tag"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $files = @(
            "README.md",
            "RELEASE_NOTES.md",
            "requirements.txt",
            "server.py",
            "index.html",
            "install.ps1",
            "Install BunkrWrap.bat",
            "start_server.bat",
            "stop_server.bat",
            "stop_server.ps1",
            "stop_server_ps.bat"
          )
          foreach ($file in $files) {
            Copy-Item -LiteralPath (Join-Path $PWD $file) -Destination $stage
          }
          Compress-Archive -Path $stage -DestinationPath "release\BunkrWrap-$tag-Windows.zip" -CompressionLevel Optimal

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $intro = @"
          ## Download

          - **BunkrWrap-$tag-Windows.zip** - Windows installer package, recommended for most users.

          ## What's changed
          "@
          gh release create $tag "release\BunkrWrap-$tag-Windows.zip" --title "BunkrWrap $tag" --notes $intro --generate-notes --verify-tag --latest
